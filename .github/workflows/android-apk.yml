name: Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Extract Android project
        run: |
          rm -rf android-project
          mkdir -p android-project

          unzip -q cyberraksha.zip -d android-project

          echo "=== Project structure ==="
          find android-project -maxdepth 3 -type f | head -150

      - name: Locate Android project
        run: |
          SETTINGS=$(find android-project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle settings file not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "======================================"
          echo "ANDROID PROJECT:"
          echo "$PROJECT_DIR"
          echo "======================================"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Create debug keystore
        run: |
          echo "======================================"
          echo "Creating debug keystore"
          echo "======================================"

          mkdir -p "$PROJECT_DIR"

          rm -f "$PROJECT_DIR/debug.keystore"

          keytool -genkeypair \
            -v \
            -keystore "$PROJECT_DIR/debug.keystore" \
            -storetype JKS \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          echo ""
          echo "=== VERIFY PROJECT KEYSTORE ==="

          if [ -f "$PROJECT_DIR/debug.keystore" ]; then
            echo "SUCCESS: $PROJECT_DIR/debug.keystore exists"
            ls -lh "$PROJECT_DIR/debug.keystore"
          else
            echo "ERROR: Project debug.keystore was NOT created"
            exit 1
          fi

      - name: Copy keystore to app folder
        run: |
          if [ -d "$PROJECT_DIR/app" ]; then
            cp "$PROJECT_DIR/debug.keystore" "$PROJECT_DIR/app/debug.keystore"
            echo "Copied keystore to app folder:"
            ls -lh "$PROJECT_DIR/app/debug.keystore"
          fi

      - name: Verify signing files
        run: |
          echo "======================================"
          echo "SIGNING FILE CHECK"
          echo "======================================"

          echo "Project:"
          ls -lh "$PROJECT_DIR/debug.keystore"

          if [ -f "$PROJECT_DIR/app/debug.keystore" ]; then
            echo "App:"
            ls -lh "$PROJECT_DIR/app/debug.keystore"
          fi

          echo ""
          echo "Keystore contents:"
          keytool -list \
            -keystore "$PROJECT_DIR/debug.keystore" \
            -storepass android

      - name: Clean old Gradle cache
        run: |
          cd "$PROJECT_DIR"

          rm -rf .gradle/configuration-cache
          rm -rf .gradle/caches

          echo "Old Gradle cache removed."

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"

          echo "======================================"
          echo "GRADLE VERSION"
          echo "======================================"

          gradle --version

          echo ""
          echo "======================================"
          echo "BUILDING APK"
          echo "======================================"

          gradle \
            --no-daemon \
            --no-configuration-cache \
            assembleDebug

      - name: Find APK
        run: |
          echo "======================================"
          echo "SEARCHING FOR APK"
          echo "======================================"

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CyberRaksha-debug-apk
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
