name: Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        run: |
          mkdir -p android-project
          unzip -q cyberraksha.zip -d android-project

          echo "=== Extracted project ==="
          find android-project -maxdepth 4 -type f | head -150

      - name: Locate Android Gradle project
        run: |
          echo "Searching for Gradle project..."

          SETTINGS=$(find android-project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts was not found."
            echo "The ZIP may not contain a complete Android Studio project."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Found Gradle project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"

          echo "=== Project files ==="
          ls -la

          echo "=== Gradle version ==="
          gradle --version

          echo "=== Building Debug APK ==="
          gradle --no-daemon assembleDebug

      - name: Find APK
        run: |
          echo "=== APK files ==="
          find "$PROJECT_DIR" -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CyberRaksha-debug-apk
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          echo "Extracted files:"
          find android-project -maxdepth 3 -type f | head -100

      # 5. Find the Gradle project
      - name: Locate Gradle project
        run: |
          echo "Searching for Gradle wrapper..."

          GRADLEW=$(find android-project -type f -name "gradlew" | head -1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found inside cyberraksha.zip"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Gradle wrapper found at: $GRADLEW"
          echo "Android project directory: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 6. Make Gradle executable
      - name: Prepare Gradle
        run: |
          chmod +x "$PROJECT_DIR/gradlew"
          "$PROJECT_DIR/gradlew" --version

      # 7. Build debug APK
      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleDebug

      # 8. Find generated APK
      - name: Find APK
        run: |
          echo "Generated APK files:"
          find "$PROJECT_DIR" -type f -name "*.apk"

      # 9. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CyberRaksha-debug-apk
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
